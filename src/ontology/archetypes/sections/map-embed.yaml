id: map-embed
displayName: Map Embed
version: 1.0.0
semanticRole: location
description: |
  Consent-gated OpenStreetMap embed (RFC-1414). Authored static tile + click-to-load
  button before consent; OSM iframe only after an explicit click. Authored fallback
  when no coordinates or address exist. Noscript: static tile + OSM link.
expectedIntents:
  - guide-navigation
  - build-trust
  - inform-contact
expectedIndustryFit:
  - trades-and-construction
  - local-services


layoutHint: single-column
bodyKind: composite
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
  shape: |
    z.object({
      latitude: z.number().optional(),
      longitude: z.number().optional(),
      address: z.string().optional(),
      zoom: z.number().min(1).max(19).default(16),
      markerLabel: z.string().optional(),
      previewImage: z.object({ src: z.string(), width: z.number().optional(), height: z.number().optional() }),
      previewAlt: z.string(),
      loadLabel: z.string(),
      linkLabel: z.string().optional(),
      fallback: z.string().optional(),
      height: z.number().optional(),
    }).strict()
acceptedCosmicNames:
  - Iris
constraints:
  consentGated: true
selection:
  purpose: Shows visitors where the business is on an interactive map without leaking third-party requests before consent.
  useWhen:
    - The business has a physical location visitors navigate to and location data (coordinates or address) is authored.
    - An authored static preview tile exists to carry the pre-consent surface.
  avoidWhen:
    -   when: No physical location exists or location is privacy-sensitive (home office).
        use: trust-strip
    -   when: Only service-area text, not a map, is needed.
        use: markdown
