id: before-after-gallery
displayName: Before-After Gallery
version: 1.0.0
semanticRole: gallery
description: |
  Paired before/after image comparison (RFC-1414). Slider variant reveals the
  after-image through a keyboard-accessible range; side-by-side renders both
  statically. Noscript shows both images of every pair sequentially;
  reduced-motion collapses to a static split. recognizablePeople flags without
  consent metadata surface a page-validation warning — authored metadata only.
expectedIntents:
  - build-trust
  - demonstrate-quality
expectedIndustryFit:
  - trades-and-construction


layoutHint: single-column
bodyKind: composite
propsSchema:
  $shape: zod
  compose:
    - section-visual
    - section-header
  shape: |
    z.object({
      items: z.array(z.object({
        before: z.object({ src: z.string(), width: z.number().optional(), height: z.number().optional() }),
        after: z.object({ src: z.string(), width: z.number().optional(), height: z.number().optional() }),
        caption: z.string().optional(),
        alt: z.string().optional(),
        recognizablePeople: z.boolean().optional(),
        consent: z.boolean().optional(),
      })),
      variant: z.enum(["slider","side-by-side"]).default("slider"),
      height: z.number().optional(),
    }).strict()
acceptedCosmicNames:
  - Echo
constraints: {}
selection:
  purpose: Proves proven work through paired before-and-after evidence rather than claims.
  useWhen:
    - The offering produces visible transformations (renovation, treatment, repair) with paired imagery.
    - Before-and-after pairs are stronger evidence than a plain image gallery.
  avoidWhen:
    -   when: Images are not genuinely paired before/after shots of the same subject.
        use: credits
    -   when: Consent for recognizable people is not on file.
        use: product-line-cards
