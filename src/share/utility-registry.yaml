utilities:
  - id: slug
    canonicalPath: packages/werkstatt-shared/src/share/slug/
    forbiddenImports:
      - "@sindresorhus/slugify"
      - cyrillic-to-translit-js
      - github-slugger
    functionNames:
      - slugify
      - toSlug
      - makeSlug
      - createSlug
      - slugUrl
      - slugId
    patterns:
      - id: nkfd-diacritic-strip
        regex: "\\.normalize\\(.{0,5}NFKD.{0,5}\\)\\.replace"
        description: NFKD normalize + diacritic strip + non-alphanumeric replace (legacy custom slugify pattern)
    allowlist:
      - path: packages/werkstatt-shared/src/share/slug/
        reason: Canonical slug module — owns all slug generation logic (RFC-0915, DNA-88)
      - path: packages/werkstatt-shared/src/share/semantic/extract.ts
        reason: CHANGE_SUMMARY comment references slugify removal — no function definition remains
      - path: packages/werkstatt-site/src/checks/tests/utility-provenance.test.ts
        reason: Test file intentionally contains forbidden patterns to validate the provenance validator (RFC-0916)
      - path: packages/werkstatt-site/src/checks/utility-provenance.ts
        reason: Validator implementation references forbidden imports/function names in string literals for detection logic (RFC-0916)
  - id: template-filter
    canonicalPath: packages/werkstatt-shared/src/share/routes/
    forbiddenImports: []
    functionNames:
      - hasPlaceholderRoutes
    patterns: []
    allowlist:
      - path: packages/werkstatt-shared/src/share/routes/
        reason: Canonical placeholder route filter — owns all template detection logic (RFC-0917)
  - id: remediation-catalog
    canonicalPath: packages/werkstatt-shared/src/share/remediation/
    forbiddenImports: []
    functionNames:
      - lookupRemediation
      - REMEDIATION_CATALOG
    patterns: []
    allowlist:
      - path: packages/werkstatt-shared/src/share/remediation/
        reason: Canonical remediation catalog — owns all ruleId-to-remediation-pattern mappings (RFC-1027)
      - path: packages/werkstatt-shared/src/checks/result-helpers.ts
        reason: Consumes lookupRemediation to auto-populate Diagnostic.remediation (RFC-1027)
      - path: packages/werkstatt-engine/src/remediation/
        reason: Engine remediation module reads REMEDIATION_CATALOG for catalog.generate and hint.validate (RFC-1027)
  - id: pbt-helpers
    canonicalPath: packages/werkstatt-shared/src/share/pbt/
    forbiddenImports: []
    functionNames:
      - fcAssert
      - letterString
      - composeWord
      - safeText
    patterns:
      - id: fc-string-filter
        regex: "fc\\.string\\([^)]*\\)\\.filter\\("
        description: fc.string().filter() anti-pattern — can cause test hangs when filter rejects most candidates (RFC-1070)
    allowlist:
      - path: packages/werkstatt-shared/src/share/pbt/
        reason: Canonical PBT helpers — owns all safe fast-check wrappers and arbitraries (RFC-1070)
