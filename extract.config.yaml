# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt-shared
# Extracts packages/werkstatt-shared from the werkstatt monorepo into a standalone public repo.
# RFC-0868: Shared infrastructure publication config.

projectDir: packages/werkstatt-shared
destName: werkstatt-shared
standalone: true
versionBump: patch

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
  - "@syrokomskyi/"
preservePackages:
  - "@warpgogol/werkstatt-shared"
stubPackages:
  - "@warpgogol/werkstatt-engine"
packageManager: "pnpm"

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - src/share/tests/create-dev-props-validator.test.ts

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml
  - action: copy
    from: packages/werkstatt-shared/pnpm-workspace.override.yaml
    to: pnpm-workspace.yaml

git:
  remote: git@github.com:syrokomskyi/werkstatt-shared.git
  autoPush: true
