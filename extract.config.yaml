forgePlugin: false
# extract.config.yaml — repo-extract standalone package export for @warpgogol/werkstatt-shared
# Extracts packages/werkstatt-shared from the werkstatt monorepo into a standalone public repo.
# RFC-0868: Shared infrastructure publication config.

projectDir: packages/werkstatt-shared
destName: werkstatt-shared
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
  - "@syrokomskyi/"
preservePackages:
  - "@warpgogol/werkstatt-shared"
  - "@warpgogol/werkstatt-engine"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - create-dev-props-validator.test.ts
  # verbund-contract.test.ts reads vendored spec snapshots from the monorepo
  # root (docs/specs/verbund-integration-spec-*/) — outside the package dir,
  # never shipped standalone; the scandir would ENOENT in the extracted repo.
  - verbund-contract.test.ts
  # RFC-1328 schema-parity tests read the vendored onboarding spec at the
  # monorepo root (docs/specs/werkstatt-onboarding/schemas/) — not shipped standalone.
  - intake-schema-parity.test.ts
  - onboarding-decision-schema-parity.test.ts
  # RFC-1444 bcp47Tag parity reads the vendored onboarding intake schema at the
  # monorepo root (docs/specs/werkstatt-onboarding/schemas/) — operator-approved
  # 2026-11-08; the path segment targets only the ontology manifest test.
  - schemas/system/tests/manifest.test.ts

postProcess:
  - action: delete
    path: AGENTS.md
  - action: copy
    from: packages/werkstatt-shared/AGENTS.standalone.md
    to: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml
  - action: copy
    from: packages/werkstatt-shared/pnpm-workspace.override.yaml
    to: pnpm-workspace.yaml

git:
  remote: git@github.com:syrokomskyi/werkstatt-shared.git
  autoPush: true
  # RFC-1252/repo-extract >=1.4.0: non-fast-forward push after history
  # transfer reconciles via fetch + merge -s ours + retry. Never force-push.
  autoReconcile: true

# package.json carries optional `link:` dep to an external pipeline path that the extract tolerates —
# JSON cannot carry an in-source pkg-health-10 comment.
pkgHealth10Suppressions:
  - package.json
